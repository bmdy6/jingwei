version: '3.8'

services:
  # QQ 协议端
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: always
    ports:
      - "6099:6099"  # WebUI 端口
      - "3020:3000"  # HTTP API
      - "3001:3001"  # WebSocket
    volumes:
      - ./napcat_data:/app/.config/QQ
      - ./napcat_data:/root/.config/QQ
    environment:
      - ACCOUNT=${QQ_BOT_ID:-}
    networks:
      - agent-net

  # AI Agent
  jingwei:
    build:
      context: .
      args:
        - USE_MIRROR=${USE_MIRROR:-false}
    container_name: jingwei
    restart: always
    depends_on:
      - napcat
    environment:
      - NAPCAT_WS_URL=ws://napcat:3001
      - NAPCAT_HTTP_URL=http://napcat:3000  # 容器内端口不变
      - JINGWEI_MODEL=${JINGWEI_MODEL-${MYAGENT_MODEL-${XL_MODEL-}}}
      - JINGWEI_API_KEY=${JINGWEI_API_KEY-${MYAGENT_API_KEY-${XL_API_KEY-}}}
      - JINGWEI_API_BASE=${JINGWEI_API_BASE-${MYAGENT_API_BASE-${XL_API_BASE-}}}
    ports:
      - "8765:8765"  # Dashboard + API
    volumes:
      - ./agent_mem:/root/.jingwei # 记忆持久化
      - .:/app # 方便代码热更新
    networks:
      - agent-net

networks:
  agent-net:
    driver: bridge
