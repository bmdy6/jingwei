# 优先级：进程环境变量 > .env > 本文件。不要在此文件写入真实凭据。
# QQ 默认关闭；开启需 QQ_ENABLED=true、QQ_ADMIN_ID、NAPCAT_WS_URL/HTTP_URL，按需设白名单。
MYAGENT_MODEL: deepseek/deepseek-chat
MYAGENT_API_KEY: ''
MYAGENT_API_BASE: https://api.deepseek.com/v1
MYAGENT_MAX_TURNS: 30
QQ_ADMIN_ID: ''
MY_AGENT_WHITE_LIST: ''
QQ_WHITE_GROUPS: ''
QQ_CSMA_BACKOFF_SECONDS: 2.0
QQ_FATIGUE_SLEEP_MINUTES: 15.0
QQ_FATIGUE_RATE: 0.4
GOOGLE_CLOUD_PROJECT: ''
GOOGLE_CLOUD_QUOTA_PROJECT: ''
STITCH_API_KEY: ''
STITCH_SERVER_CMD: ''
STITCH_TIMEOUT: 180
EMBEDDING_MODE: local
DEEPSEEK_API_KEY: ''
MYAGENT_MODEL_FLASH: ''
MYAGENT_MODEL_PRO: ''
IMAGE2_BASE: ''
IMAGE2_USER: ''
IMAGE2_PASS: ''
notebooklm:
  vault_path: ''
  bin_path: notebooklm-mcp
  env: {}
TENCENT_CLOUD_SECRET_ID: ''
TENCENT_CLOUD_SECRET_KEY: ''
TENCENT_CLOUD_COS_BUCKET: ''
TENCENT_CLOUD_COS_REGION: ap-guangzhou
memory:
  base_dir: ~/.xl-agent/memory
  backup_dir: ./agent_memory/core
  auto_backup_to_project: false
  multi_instance_isolation: true
  local_model_path: ./model/m3e-base
knowledge_base:
  notes_paths: []
  kb_dir: ''
SESSION_PERMISSION_TIMEOUT: 1800
thresholds:
  skill_relevance_low: 2.5
  skill_relevance_high: 5.0
  skill_prompt_max_chars: 2500
  skill_promotion_usage: 5
  skill_promotion_success_rate: 0.9
  experience_recall_top_k: 2
  experience_prompt_max_chars: 2000
  tts_idle_timeout_seconds: 7200
  tts_health_timeout: 3.0
  tts_health_fail_threshold: 3
  dream_cosine_merge: 0.9
  dream_cosine_damping: 0.75
  dream_trigger_tokens: 64000
  fatigue_decay_rate: 2.0
  cluster_similarity: 0.82
QQ_ENABLED: false
